<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title></title>
  <style type="text/css" media="screen">
    body
    {
      background-color: #f5f6f4;
      margin: 0;
      padding: 0;
    }

    a img
    {
      border: none;
    }

    a
    {
      border: none;
    }

    td.permission
    {
      padding: 30px 0 10px 0;
    }

    .permission
    {
      font-family: 'Lucida Grande';
      font-size: 10px;
      color: #666666;
      padding: 4px 0 4px 0;
    }

      .permission a
      {
        color: #333333;
      }

      .permission p
      {
        margin: 0 0 4px 0;
      }

    .header
    {
      background-color: #353535;
    }

      .header h1
      {
        font-family: Georgia;
        font-size: 32px;
        font-weight: normal;
        color: #bfbfbf;
        display: inline;
        text-align: left;
      }

    .date h3
    {
      font-family: Georgia;
      font-size: 14px;
      color: #bfbfbf;
      font-weight: normal;
      text-align: right;
      display: inline;
      font-style: italic;
    }

    .body
    {
      background-color: #ffffff;
    }

    td.sidebar
    {
      padding: 22px 10px 10px 10px;
    }

    .sidebar h2
    {
      font-family: Georgia;
      font-size: 18px;
      font-weight: bold;
      color: #808080;
      margin: 0 0 6px 4px;
      padding: 0;
      text-align: left;
    }

      .sidebar h2.issue
      {
        color: #000000;
        margin: 0 0 10px 10px;
      }

    .sidebar ul
    {
      font-family: Georgia;
      font-size: 12px;
      color: #2679b9;
      margin: 0 0 0 24px;
      padding: 0;
      text-align: left;
    }

      .sidebar ul a
      {
        font-family: Georgia;
        font-size: 12px;
        color: #2679b9;
        font-style: italic;
      }

      .sidebar ul li
      {
        margin: 0 0 10px 0;
      }

    .sidebar p
    {
      font-family: 'Lucida Grande';
      font-size: 11px;
      color: #5f5f5f;
      padding: 0;
      margin: 0 0 12px 0;
      text-align: left;
    }

    td.sidebg
    {
      background-color: #f1f1f1;
      padding: 10px 16px 10px 16px;
      width: 200px;
    }

    .sidebg li
    {
      font-family: 'Lucida Grande';
      font-size: 12px;
      color: #333333;
      margin: 0 0 10px 0;
      text-align: left;
    }

    td.mainbar
    {
      padding: 22px 14px 0 14px;
    }

    .mainbar p
    {
      font-family: 'Lucida Grande';
      font-size: 14px;
      color: #333333;
      margin: 0 0 10px 0;
      text-align: left;
    }

      .mainbar p.first
      {
        margin-top: 10px;
      }

    .mainbar h2
    {
      font-family: 'Lucida Grande';
      font-size: 16px;
      color: #000000;
      text-transform: uppercase;
      margin: 10px 0 16px 0;
    }

      .mainbar h2 a
      {
        font-family: 'Lucida Grande';
        font-size: 16px;
        color: #000000;
        text-transform: uppercase;
        text-decoration: none;
        font-style: normal;
      }

    .mainbar a
    {
      font-family: Georgia;
      font-size: 13px;
      color: #2679b9;
      font-style: italic;
    }

      .mainbar a.center
      {
        font-size: 12px;
        text-align: center;
        display: block;
        color: #999999;
        padding: 8px 0 12px 0;
        text-decoration: none;
      }

    .mainbar img.inline
    {
      border: 1px solid #dedede;
      padding: 4px;
    }

    .mainbar ul li
    {
      font-family: 'Lucida Grande';
      font-size: 14px;
      color: #333333;
    }

    td.footer
    {
      padding: 0 0 10px 0;
      border-top: 2px solid #ededed;
    }

    .footer p
    {
      color: #a1a1a1;
      font-size: 11px;
      margin: 0;
      padding: 0;
    }

      .footer p.first
      {
        margin: 14px 0 0 0;
      }

    .footer a
    {
      font-family: 'Lucida Grande';
      font-size: 11px;
      color: #2679b9;
    }

    .HeaderTr_1
    {
      background-image: url(http://lucrative.dk/images/dbLine.gif);
      background-position: top;
      background-repeat: repeat-x;
    }

    .HeaderTr_2
    {
      background-image: url(http://lucrative.dk/images/singleLine.gif);
      background-position: top;
      background-repeat: repeat-x;
    }

    .HeaderProductLogo
    {
      text-align: left;
    }

    .HeaderCustomerLogo
    {
      text-align: right;
    }

    div#topBar
    {
      background: #00ADEE;
      color: #FFF;
      font-weight: bold;
      height: 60px;
      width: 100%;
      font-size: medium;
      font-family: Verdana;
    }
    div#Footer
    {
      background: #00ADEE;
      color: #FFF;
      height: 20px;
      width: 100%;
      font-size: small;
      font-family: Verdana;
    }
  </style>
</head>
<body>
  <a name="top" id="top"></a>
  <table width="100%" cellspacing="0" cellpadding="0" bgcolor="#f5f6f4">
    <tr>
      <td align="center">
        <table width="600" cellspacing="0" cellpadding="0">
          <tr>
            <td align="center" class="permission"></td>
          </tr>
          <tr>
            <td height="77" align="left">
              <div id="topBar">
                <div style="float: right; margin-right: 10px; margin-top: 15px">FlytJord.dk</div>
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td align="center">
        <table width="600" cellspacing="0" cellpadding="0" class="body">
          <tr>
            <td align="left" valign="top" width="348" class="mainbar">
              <p>
                Til $navn$
              </p>
              <p>Tekst</p>

            </td>
            <td align="center" valign="top" width="219" class="sidebar">
              <h2>Link</h2>
              <table border="0" cellspacing="0" cellpadding="0">
                <tr>
                  <td class="sidebg" align="center">
                    <ul>
                      <li><a href="$link_admin$">Vis anmeldelsen</a></li>
                    </ul>
                  </td>
                </tr>
              </table>

            </td>
          </tr>
          <tr>
            <td colspan="2" align="center">&nbsp;
              <div id="Footer">
              <div style="float: left; margin-right: 10px; ">&nbsp;</div>  
              </div>
            </td>
          </tr>
        </table>
        
      </td>
    </tr>
  </table>
</body>
</html>
